# Extended configuration for comprehensive integration testing
redisSpecs: &redisSpecs
  host: localhost
  port: '6379'
  database: 0

postgresSpecs: &postgresSpecs
  databaseUrl: postgres://postgres:postgres@localhost:5432/webhooked_test?sslmode=disable
  query: |
    INSERT INTO webhook_events (webhook_name, payload, received_at) 
    VALUES (:webhook_name, :payload, NOW())
  args:
    webhook_name: '{{ .SpecName }}'
    payload: '{{ .Payload }}'

rabbitmqSpecs: &rabbitmqSpecs
  databaseUrl: amqp://rabbitmq:rabbitmq@localhost:5672/

defaultSecurity: &defaultSecurity
  type: custom
  specs:
    condition: |
      {{ eq (.Request.Header.Peek "X-Token" | toString) "integration-test" }}

githubSecurity: &githubSecurity
  type: github
  specs:
    secret: github-secret

customAuthSecurity: &customAuthSecurity
  type: custom
  specs:
    condition: |
      {{ and 
        (eq (.Request.Header.Peek "Authorization" | toString) "Bearer valid-token-123")
        (eq (.Request.Header.Peek "X-API-Key" | toString) "secret-api-key")
      }}

noSecurity: &noSecurity
  type: noop

apiVersion: v1alpha2
kind: Configuration
metadata:
  name: webhooked-extended-integration-tests
specs:
  - metricsEnabled: true
    webhooks:
      - name: basic-usage
        entrypointUrl: /integration/basic-usage
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: integration:basic-usage
      - name: basic-formatted-usage
        entrypointUrl: /integration/basic-formatted-usage
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: integration:basic-formatted-usage
            formatting:
              templateString: 'redis:{{ .Request.Header.Peek "Content-Type" | toString }}|{{ .Payload }}'
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          formatting:
            templateString: |
              {"status": "OK", "data": {{ .Payload }}}
      - name: advanced-formatted-usage
        entrypointUrl: /integration/advanced-formatted-usage
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: integration:advanced-formatted-usage
            formatting:
              templateString: '{{- with $payload := fromJson .Payload -}}redis:{{ $payload.id }}|{{ $payload.name }}|hasNotes:{{ not (empty $payload.notes) }}|hasPets:{{ not (empty $payload.pets) }}|hasChildrens:{{ not (empty $payload.childrens) }}|childrensCount:{{ len $payload.childrens }}{{- end -}}'
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          formatting:
            templateString: |
              {{ with $payload := fromJson .Payload }}
              {
                "user": {
                  "id": {{ $payload.id }},
                  "name": {{ $payload.name | toJson }}
                },
                "hasNotes": {{ not (empty $payload.notes) }},
                "hasChildrens": {{ not (empty $payload.childrens) }},
                "hasPets": {{ not (empty $payload.pets) }},
                {{- with $fc := $payload.favoriteColors }}
                "favoriteColor": {{ coalesce $fc.primary $fc.secondary "black" | toJson }},
                {{- end }}
                "childrenNames": [
                  {{- range $index, $child := $payload.childrens -}} {{ $child.name | toJson }}
                  {{- if lt $index (toInt (sub (len $payload.childrens) 1)) -}},{{- end -}}
                  {{- end -}}
                ]
              }
              {{ end }}
      # PostgreSQL Integration Tests
      - name: postgres-basic
        entrypointUrl: /integration/postgres-basic
        security: *defaultSecurity
        storage:
          - type: postgres
            specs:
              <<: *postgresSpecs
      - name: postgres-formatted
        entrypointUrl: /integration/postgres-formatted
        security: *defaultSecurity
        storage:
          - type: postgres
            specs:
              <<: *postgresSpecs
              args:
                webhook_name: 'postgres-formatted'
                payload: |
                  {
                    "webhook": "postgres-formatted",
                    "delivery_id": "{{ .Request.Header.Peek "X-Delivery" | toString }}",
                    "event": {{ .Payload }}
                  }
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          formatting:
            templateString: |
              {"status":"stored","delivery_id":"{{ .Request.Header.Peek "X-Delivery" | toString }}"}
      # Redis Integration Tests
      - name: redis-basic
        entrypointUrl: /integration/redis-basic
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: integration:redis-basic
      - name: redis-formatted
        entrypointUrl: /integration/redis-formatted
        security: *defaultSecurity
        storage:
          - type: redis
            formatting:
              templateString: '{{- with $payload := fromJson .Payload -}}redis|{{ $payload.ip }}|{{ $payload.type }}{{- end -}}'
            specs:
              <<: *redisSpecs
              key: integration:redis-formatted
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          formatting:
            templateString: '{"status":"stored","delivery_id":"{{ .Request.Header.Peek "X-Delivery" | toString }}"}'
      # RabbitMQ Integration Tests
      - name: rabbitmq-basic
        entrypointUrl: /integration/rabbitmq-basic
        security: *defaultSecurity
        storage:
          - type: rabbitmq
            specs:
              <<: *rabbitmqSpecs
              queueName: rabbitmq-basic-storage
              durable: false
              deleteWhenUnused: true
      - name: rabbitmq-formatted
        entrypointUrl: /integration/rabbitmq-formatted
        security: *defaultSecurity
        storage:
          - type: rabbitmq
            formatting:
              templateString: '{{- with $payload := fromJson .Payload -}}rabbitmq|{{ $payload.type }}|{{ $payload.to }}{{- end -}}'
            specs:
              <<: *rabbitmqSpecs
              queueName: rabbitmq-formatted-storage
              durable: false
              deleteWhenUnused: true
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          formatting:
            templateString: '{"status":"stored","delivery_id":"{{ .Request.Header.Peek "X-Delivery" | toString }}"}'
      # Security Integration Tests
      - name: github-webhook
        entrypointUrl: /integration/github-webhook
        security: *githubSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: github:events
      - name: no-security
        entrypointUrl: /integration/no-security
        security: *noSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: no-security:events
      - name: custom-security
        entrypointUrl: /integration/custom-security
        security: *customAuthSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: custom-security:events
      # Multi-Storage Integration Tests
      - name: multi-storage
        entrypointUrl: /integration/multi-storage
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: multi-storage:events
          - type: postgres
            specs:
              databaseUrl: postgres://postgres:postgres@postgres:5432/webhooked_test?sslmode=disable
              query: |
                INSERT INTO webhook_events (webhook_name, payload, received_at) 
                VALUES (:webhook_name, :payload, NOW())
              args:
                webhook_name: 'multi-storage'
                payload: |
                  {
                    "webhook": "multi-storage",
                    "event_id": "{{ .Request.Header.Peek "X-Event-ID" | toString }}",
                    "data": {{ .Payload }}
                  }
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          formatting:
            templateString: |
              {
                "status": "received",
                "event_id": "{{ .Request.Header.Peek "X-Event-ID" | toString }}",
                "stored_in": ["redis", "postgres"]
              }
      - name: multi-storage-formatted
        entrypointUrl: /integration/multi-storage-formatted
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: formatted:events
            formatting:
              templateString: |
                {{- with $payload := fromJson .Payload -}}
                redis|{{ .Request.Header.Peek "X-Source" | toString }}|{{ $payload.id }}|{{ $payload.type }}
                {{- end -}}
          - type: postgres
            specs:
              databaseUrl: postgres://postgres:postgres@postgres:5432/webhooked_test?sslmode=disable
              query: |
                INSERT INTO webhook_events (webhook_name, payload, received_at) 
                VALUES (:webhook_name, :payload, NOW())
              args:
                webhook_name: 'formatted'
                payload: |
                  {
                    "source": "{{ .Request.Header.Peek "X-Source" | toString }}",
                    "timestamp": "{{ .Request.Header.Peek "X-Timestamp" | toString }}",
                    "event": {{ .Payload }}
                  }
      # Error Scenarios
      - name: large-payload
        entrypointUrl: /integration/large-payload
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: integration:large-payload-events
      - name: empty-payload
        entrypointUrl: /integration/empty-payload
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: empty-payload:events
      - name: invalid-json-payload
        entrypointUrl: /integration/invalid-json-payload
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: invalid-json-payload:events
