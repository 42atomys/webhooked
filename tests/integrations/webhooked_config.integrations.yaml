redisSpecs: &redisSpecs
  host: redis
  port: '6379'
  database: 0

defaultSecurity: &defaultSecurity
  type: custom
  specs:
    condition: |
      {{ eq (.Request.Header.Peek "X-Token" | toString) "integration-test" }}

apiVersion: v1alpha2
kind: Configuration
metadata:
  name: webhooked-integration-tests
specs:
  - metricsEnabled: true
    webhooks:
      - name: basic-usage
        entrypointUrl: /integration/basic-usage
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: integration:basic-usage
      - name: basic-formatted-usage
        entrypointUrl: /integration/basic-formatted-usage
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: integration:basic-formatted-usage
            formatting:
              templateString: 'redis:{{ .Request.Header.Peek "Content-Type" | toString }}|{{ .Payload }}'
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          formatting:
            templateString: |
              {"status": "OK", "data": {{ .Payload }}}
      - name: advanced-formatted-usage
        entrypointUrl: /integration/advanced-formatted-usage
        security: *defaultSecurity
        storage:
          - type: redis
            specs:
              <<: *redisSpecs
              key: integration:advanced-formatted-usage
            formatting:
              templateString: '{{- with $payload := fromJson .Payload -}}redis:{{ $payload.id }}|{{ $payload.name }}|hasNotes:{{ not (empty $payload.notes) }}|hasPets:{{ not (empty $payload.pets) }}|hasChildrens:{{ not (empty $payload.childrens) }}|childrensCount:{{ len $payload.childrens }}{{- end -}}'
        response:
          statusCode: 200
          headers:
            Content-Type: application/json
          formatting:
            templateString: |
              {{ with $payload := fromJson .Payload }}
              {
                "user": {
                  "id": {{ $payload.id }},
                  "name": {{ $payload.name | toJson }}
                },
                "hasNotes": {{ not (empty $payload.notes) }},
                "hasChildrens": {{ not (empty $payload.childrens) }},
                "hasPets": {{ not (empty $payload.pets) }},
                {{- with $fc := $payload.favoriteColors }}
                "favoriteColor": {{ coalesce $fc.primary $fc.secondary "black" | toJson }},
                {{- end }}
                "childrenNames": [
                  {{- range $index, $child := $payload.childrens -}} {{ $child.name | toJson }}
                  {{- if lt $index (toInt (sub (len $payload.childrens) 1)) -}},{{- end -}}
                  {{- end -}}
                ]
              }
              {{ end }}
